<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulary Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8fb;--card:#fff;--ink:#16324a;--mute:#5a7186;--line:#cfdde8;--accent:#1f7a8c;--accent-ink:#fff;--ok:#1b7f4b;--okbg:#dff3e7;--bad:#b3341f;--badbg:#fbe4df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1e2b;--card:#172c3d;--ink:#e8f1f7;--mute:#9bb3c5;--line:#2c4559;--accent:#5cc2d3;--accent-ink:#0b1b27;--ok:#6ad394;--okbg:#17402b;--bad:#ff9a87;--badbg:#4a2118}}
:root[data-theme="dark"]{--bg:#0f1e2b;--card:#172c3d;--ink:#e8f1f7;--mute:#9bb3c5;--line:#2c4559;--accent:#5cc2d3;--accent-ink:#0b1b27;--ok:#6ad394;--okbg:#17402b;--bad:#ff9a87;--badbg:#4a2118}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:clamp(1.7rem,6vw,2.4rem);font-weight:800;margin:8px 0 4px;line-height:1.15}
.sub{color:var(--mute);margin:0 0 20px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{flex:1;padding:12px 8px;font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.score{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;font-weight:800;border-bottom:1px solid var(--line);margin-bottom:16px;z-index:2}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.q h2{font-size:1.1rem;margin:0 0 10px;font-weight:700}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:10px 12px;margin-top:8px;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.tabs button:focus-visible,.again:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin:10px 0 0;font-weight:700;min-height:1.5em}
.done{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:20px;text-align:center;font-size:1.2rem;font-weight:800}
.again{margin-top:12px;font:inherit;font-weight:700;padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<p class="sub">Choose the best meaning for each word. You see the answer right away.</p>
<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true">Grades 1 to 5</button>
<button role="tab" id="t2" aria-selected="false">Grades 6 to 9</button>
</div>
<div class="score" id="score" aria-live="polite"></div>
<div id="quiz"></div>
</main>
<script>
// word | correct meaning | three wrong meanings
var DATA={
g1:["enormous|Very big|Very small|Very loud|Very old","brave|Not afraid to face danger|Very sleepy|Easily scared|Very quiet","gather|To bring together|To throw away|To break apart|To hide","whisper|To speak very softly|To shout|To sing|To cry","delighted|Very happy|Very angry|Very tired|Very hungry","curious|Wanting to learn or know more|Bored|Sleepy|Rude","ancient|Very old|Brand new|Very shiny|Very tall","fragile|Easily broken|Very heavy|Very colorful|Very sticky","swift|Fast|Slow|Loud|Soft","peaceful|Calm and quiet|Noisy and busy|Dark and scary|Hot and dry","weary|Very tired|Full of energy|Very funny|Very clean","journey|A trip from one place to another|A kind of book|A type of food|A small room","shiver|To shake because you are cold or scared|To jump up high|To run fast|To laugh loudly","neighbor|A person who lives near you|A teacher|A family pet|A kind of store","protect|To keep safe|To forget|To waste|To break","mighty|Very strong|Tiny|Silly|Shy","glimmer|To shine with a soft, faint light|To fall down|To make a loud noise|To melt","reply|To answer|To ask|To forget|To skip","observe|To watch carefully|To ignore|To build|To throw","generous|Happy to give and share|Always angry|Always late|Always hungry"],
g2:["benevolent|Kind and well-meaning|Hostile and aggressive|Clever and sly|Careless and lazy","ambiguous|Open to more than one meaning|Perfectly clear|Very short|Completely false","meticulous|Extremely careful about details|Messy and rushed|Cheerful and loud|Shy and nervous","reluctant|Unwilling or hesitant|Eager|Skilled|Forgetful","ephemeral|Lasting a very short time|Lasting forever|Very valuable|Hard to see","pragmatic|Practical and focused on what works|Dreamy and unrealistic|Proud and boastful|Fearful of change","scrutinize|To examine closely|To glance at quickly|To admire|To destroy","candid|Honest and straightforward|Secretive|Polite but untruthful|Confused","ubiquitous|Found everywhere|Extremely rare|Dangerous|Underground","diligent|Hardworking and careful|Easily distracted|Naturally gifted|Rebellious","resilient|Able to recover quickly from difficulty|Easily broken|Very rich|Extremely quiet","verbose|Using more words than necessary|Using very few words|Speaking in a foreign language|Speaking in a whisper","meager|Small and inadequate|Plentiful|Delicious|Expensive","hypothesis|A testable explanation or prediction|A proven law of nature|A type of lab equipment|A final conclusion","obsolete|No longer used or out of date|Brand new|Popular|Expensive","adversary|An opponent|A close friend|A teacher|A judge","eloquent|Skilled at clear, powerful expression|Unable to speak clearly|Very loud|Silent","frugal|Careful with money|Fond of luxury|Generous to strangers|Always in debt","mundane|Ordinary and unexciting|Thrilling|Magical|Worldwide","tenacious|Persistent and determined|Quick to give up|Easily confused|Cautious"]
};
var TITLES={g1:"Vocabulary Quiz: Grades 1 to 5",g2:"Vocabulary Quiz: Grades 6 to 9"};
var group="g1",score=0,answered=0,items=[];
var $=function(id){return document.getElementById(id)};
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function build(){
  score=0;answered=0;
  items=DATA[group].map(function(r){var p=r.split("|");return{w:p[0],c:p[1],o:shuffle(p.slice(1))}});
  $("title").textContent=TITLES[group];
  document.title=TITLES[group];
  $("t1").setAttribute("aria-selected",group==="g1");
  $("t2").setAttribute("aria-selected",group==="g2");
  var box=$("quiz");box.innerHTML="";
  items.forEach(function(it,i){
    var q=document.createElement("div");q.className="q";
    var h=document.createElement("h2");h.textContent=(i+1)+". What does “"+it.w+"” mean?";q.appendChild(h);
    var fb=document.createElement("p");fb.className="fb";
    it.o.forEach(function(text){
      var b=document.createElement("button");b.className="opt";b.textContent=text;
      b.onclick=function(){
        var all=q.querySelectorAll(".opt");
        all.forEach(function(x){x.disabled=true;if(x.textContent===it.c)x.classList.add("ok")});
        answered++;
        if(text===it.c){score++;fb.textContent="Correct!"}
        else{b.classList.add("bad");fb.textContent="Not quite. The answer is: "+it.c}
        update();
      };
      q.appendChild(b);
    });
    q.appendChild(fb);box.appendChild(q);
  });
  update();
}
function update(){
  $("score").textContent="Score: "+score+" / "+answered+" answered (20 questions)";
  var old=document.querySelector(".done");if(old)old.remove();
  if(answered===20){
    var d=document.createElement("div");d.className="done";
    d.innerHTML="You got "+score+" out of 20!<br>";
    var b=document.createElement("button");b.className="again";b.textContent="Try again";
    b.onclick=function(){build();window.scrollTo(0,0)};
    d.appendChild(b);$("quiz").appendChild(d);
  }
}
function pick(g){group=g;try{history.replaceState(null,"","#"+(g==="g1"?"grades-1-5":"grades-6-9"))}catch(e){}build()}
$("t1").onclick=function(){pick("g1")};
$("t2").onclick=function(){pick("g2")};
if(location.hash==="#grades-6-9")group="g2";
build();
</script>
</body>
</html>
